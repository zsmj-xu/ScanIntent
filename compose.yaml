name: scanintent
services:
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:810861a2e2d0188744f5f23b2d3ec9ff95812bcb9ddbb8fed13a377a7f305893
    ports:
      - "127.0.0.1:18124:8123"
    environment:
      CLICKHOUSE_DB: scanintent
      CLICKHOUSE_USER: scanintent
      CLICKHOUSE_PASSWORD: ${SCANINTENT_CLICKHOUSE_PASSWORD:?Run python3 scanintent.py init-local first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - scanintent-clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  scanintent-clickhouse-data:
